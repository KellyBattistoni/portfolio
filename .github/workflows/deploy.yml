name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install webkit --with-deps

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Start preview server (background, stdin redirected to prevent SIGTTIN)
        run: npx vite preview < /dev/null &

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173/portfolio/ --timeout 30000

      - name: Run Playwright smoke tests
        run: npx playwright test

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Deployment summary
        run: echo "Deployed to https://KellyBattistoni.github.io/portfolio/"
